<!doctype html>
<!--
  OCR test page (milestone 2). Not part of the popup.
  Open it at chrome-extension://<extension id>/ocr-demo.html after loading dist/.
  Everything runs in this page: nothing is sent to the backend or anywhere else.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckYo'Self - OCR test page</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 760px; color: #1d1d1f; background: #fff; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .note { color: #555; margin: 0 0 12px; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 12px; padding: 8px 12px; }
    button { margin: 2px 4px 2px 0; }
    progress { width: 100%; }
    #status.error { color: #b00020; font-weight: 600; }
    #preview-wrap { position: relative; display: inline-block; border: 1px solid #ccc; background: #f4f4f4; }
    #preview { display: block; width: 360px; height: 240px; object-fit: contain; }
    .box { position: absolute; border: 2px solid #e8a400; background: rgba(255, 200, 0, 0.18); pointer-events: none; }
    .box.low { border-color: #b00020; }
    .box.quote { border-color: #0066cc; background: rgba(0, 102, 204, 0.2); }
    textarea { width: 100%; box-sizing: border-box; font: inherit; }
    pre { background: #f6f6f6; padding: 8px; overflow-x: auto; white-space: pre-wrap; }
    .hint { color: #8a5a00; }
  </style>
</head>
<body>
  <h1>OCR test page</h1>
  <p class="note">Reads text from a photo on this computer. The photo and the box positions never leave this page.</p>

  <fieldset>
    <legend>1. Pick an image</legend>
    <input id="file" type="file" accept="image/*">
    <div>Fictional samples:
      <button type="button" data-sample="team-banner.png">Team banner</button>
      <button type="button" data-sample="no-text.png">No text</button>
      <button type="button" data-sample="rotated-sign.png">Rotated sign</button>
      <button type="button" data-sample="script-card.png">Script lettering</button>
      <button type="button" data-sample="small-sign.png">Small sign on a building</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>2. Scan</legend>
    <progress id="progress" max="1" value="0"></progress>
    <div id="status">Waiting for an image.</div>
    <button id="cancel" type="button" disabled>Cancel</button>
  </fieldset>

  <fieldset>
    <legend>3. Review the text (fix any mistakes)</legend>
    <div id="preview-wrap"><img id="preview" alt="Image being scanned"></div>
    <p id="hint" class="hint"></p>
    <textarea id="review" rows="5" disabled></textarea>
    <label>Highlight a quote in the photo: <input id="quote" type="text" placeholder="e.g. 608-555-0142"></label>
    <span id="quote-status"></span>
  </fieldset>

  <fieldset>
    <legend>4. What would be sent to the backend (text only)</legend>
    <pre id="source">(nothing yet)</pre>
  </fieldset>

  <script type="module" src="ocr-demo.js"></script>
</body>
</html>
